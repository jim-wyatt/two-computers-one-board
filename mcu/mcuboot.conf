#
# Extra Kconfig for the MCUboot build in mcu/flash-all.sh, on top of MCUboot's
# own configuration for this board.
#
# DOWNGRADE PREVENTION
# --------------------
# MCUboot refuses to swap in an image whose version is LOWER than the running
# one, and erases it from slot 1 instead. Before this, nothing below
# unoq.fota.test() stood in the way: mark the previous image (which is what
# the inactive slot holds after a confirm) and the next reset ran it.
#
# The build number counts. Every image zbuild signs is 0.0.0+<seconds since
# 1970>, so major.minor.revision is always 0.0.0 and the build number is the
# only part that moves - without it every image would compare equal, and equal
# is allowed through. With it, a newer build is a higher version and an older
# one is refused.
#
# Not refused: MCUboot reverting an image that was never confirmed (a revert is
# not an upgrade, so this check does not run for it), and an image equal to
# the running one. Going back to older firmware on purpose means building that
# source again, which stamps it with a newer build number.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_BOOT_VERSION_CMP_USE_BUILD_NUMBER=y
