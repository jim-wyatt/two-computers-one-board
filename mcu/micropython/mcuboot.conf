#
# Extra Kconfig for MicroPython's Zephyr port, on top of the port's prj.conf
# and its own boards/arduino_uno_q.conf. mcu/micropython/build.sh passes it as
# EXTRA_CONF_FILE.
#
# AN MCUBOOT APPLICATION IMAGE
# ----------------------------
# Linked into slot0 behind the image header (CONFIG_ROM_START_OFFSET, 0x400
# here), exactly as this project's own firmware is (mcu/app/prj.conf), so the
# bootloader that is already on the board will take it as an update. The mode is Zephyr's default for MCUboot,
# swap-using-offset, which is the mode the bootloader is built for.
#
# It has no SMP and no image manager: MicroPython cannot confirm itself, and
# cannot take the next update. Both are the point. It runs only until the next
# reset, and that reset swaps this project's firmware back in.
CONFIG_BOOTLOADER_MCUBOOT=y

# NO NETWORK
# ----------
# The port's prj.conf turns on IPv4, IPv6, TCP, DHCP and DNS for boards that
# have an interface. This MCU has none: its only links to anything are the
# UART and the SPI bus to Linux. The stack would cost flash, RAM and a
# three-second wait at boot (NET_CONFIG_INIT_TIMEOUT) for an interface that
# will never come up.
CONFIG_NETWORKING=n
CONFIG_NET_SOCKETS=n
CONFIG_DNS_RESOLVER=n
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_TEST_RANDOM_GENERATOR=n

# The board file enables a Vbat sensor on adc4, which the overlay turns off
# (its comment says why). Its driver defaults to y with SENSOR, which the
# port's prj.conf turns on. mcu/app/prj.conf does the same.
CONFIG_STM32_VBAT=n
