#
# The smallest firmware that can hold one end of a conversation: a UART, two
# LEDs, and nothing else that might write to the wire.

CONFIG_GPIO=y
CONFIG_SERIAL=y

# NOTHING ELSE MAY TALK ON THIS WIRE. The main firmware puts a shell and the
# console on lpuart1, so a prompt, a boot banner and every log line would
# arrive on Linux mixed in with the one byte this experiment is about.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n
CONFIG_SHELL=n

# Started by MCUboot, like the main firmware, so it is flashed and replaced the
# same way. mcu/zbuild.sh signs it because of this line.
CONFIG_BOOTLOADER_MCUBOOT=y
