# --- MPU <-> MCU link -------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# --- Interactive shell on the same UART the MPU reads (lpuart1) -------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="unoq:~$ "

# Built-in command sets: poke hardware without rebuilding.
CONFIG_GPIO_SHELL=y
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_KERNEL_SHELL=y

# --- SMP / MCUmgr over the shell transport ----------------------------------
# One UART serves console + shell + SMP, so SMP is multiplexed over the shell
# rather than claiming its own port.
# MCUMGR_TRANSPORT_SHELL needs these four or it silently disables itself
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT=y
CONFIG_MCUMGR_GRP_STAT=y
CONFIG_STATS=y
CONFIG_STATS_NAMES=y

CONFIG_MAIN_STACK_SIZE=2048

# --- 8x13 LED matrix --------------------------------------------------------
# Charlieplexed on PF0..PF10, refreshed from a TIM17 counter callback at 100kHz.
# See mcu/app/src/matrix.c and boards/arduino_uno_q.overlay.
CONFIG_COUNTER=y

# --- Die temperature: `app temp` --------------------------------------------
# The STM32U585's internal temperature sensor, which Linux has no view of.
# The board file already marks the sensor and adc1 "okay", so this is all it
# takes: SENSOR is the subsystem, and with it on STM32_TEMP defaults to y and
# selects ADC by itself. Both are written out anyway, so that the dependency
# is visible here and a Zephyr that changes a default fails loudly.
CONFIG_SENSOR=y
CONFIG_STM32_TEMP=y
CONFIG_ADC=y
# The board file also enables a Vref and a Vbat sensor, and their drivers
# default to y the moment SENSOR is on. Nothing here reads them.
CONFIG_STM32_VREF=n
CONFIG_STM32_VBAT=n

# --- Persistent storage in storage_partition (128K, previously unused) ------
# Holds one byte: the panel orientation set by `app matrix flip`.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- MCUboot: app becomes a signed image in slot0, updatable over SMP -------
CONFIG_BOOTLOADER_MCUBOOT=y
# The bootloader refuses an image older than the running one (mcu/mcuboot.conf).
# Said here too so the app reports it: SMP's bootloader info says what MCUboot
# will and will not do, and a tool reading it should not have to guess.
CONFIG_MCUBOOT_BOOTLOADER_NO_DOWNGRADE=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y

# --- The MCU's own watchdog: guard.c, `app reset`, `app hang yes` -----------
# The IWDG, which the board file already marks "okay" and aliases watchdog0.
# With WATCHDOG on, IWDG_STM32 defaults to y. HWINFO is how the reset cause is
# read: RCC's reset flags, through hwinfo_stm32.c. See mcu/app/include/guard.h.
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y

# --- The SPI link to Linux: spi_link.c, spi_proto.h -------------------------
# spi3 is the MCU's end of /dev/spidev0.0, and Linux is the master, so the MCU
# is a slave. The board file already marks spi3 "okay" (the overlay says so
# again, where it can be read). SPI_SLAVE is what lets the driver take
# SPI_OP_MODE_SLAVE; SPI_STM32_INTERRUPT is what lets a slave wait for Linux
# without spinning: polled, the transfer would busy-loop until the master
# clocked, and the shell, the panel and the watchdog's feeder would starve.
CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_SPI_STM32_INTERRUPT=y

# --- Jitter: `app jitter`, jitter.c, jitter.h -------------------------------
# PWM out on D3 from TIM3, the same square wave captured on D2 by TIM2, and
# TIM5 as the 1 MHz clock the ticks are timestamped by (through COUNTER,
# already on for the panel). See the overlay for the timers and pins.
# PWM_CAPTURE is what gives the STM32 PWM driver its input-capture half, and
# with it the timer interrupt the period callback runs from.
CONFIG_PWM=y
CONFIG_PWM_CAPTURE=y
