[project]
name = "unoq"
version = "1.2.0"
description = "Talk to the Arduino UNO Q's STM32U585 from the Linux MPU"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jim Wyatt" }]
dependencies = ["pyserial", "gpiod", "smpclient"]

# Re-run the editable install after adding a script here, or the command will
# not appear on PATH: `python -m unoq.cpubars` works either way.
[project.scripts]
unoq-ble-sensor = "unoq.blesensor:main"
unoq-buildlight = "unoq.buildlight:main"
unoq-cpu-bars = "unoq.cpubars:main"
unoq-jitter = "unoq.jitter:main"
unoq-learn = "unoq.learn:main"
unoq-powerlog = "unoq.powerlog:main"
unoq-temp-log = "unoq.templog:main"

# Install with:  tools/install-dev-tools.sh   (it passes the lock file; a bare
# `uv pip install -e` would take whatever versions are newest)
# Everything below is also what tools/check.sh runs.
[project.urls]
Homepage = "https://jim-wyatt.github.io/two-computers-one-board/"
Source = "https://github.com/jim-wyatt/two-computers-one-board"
Issues = "https://github.com/jim-wyatt/two-computers-one-board/issues"

[project.optional-dependencies]
# clang-format is PINNED, unlike the rest. Ruff and mypy disagreeing between
# versions produces a new diagnostic, which is a real finding; a formatter
# disagreeing produces a gate that passes locally and fails in CI, which
# teaches people to ignore the gate. Bump it deliberately, reformat in the same
# commit, and never as a side effect of someone re-running the installer.
# Same reasoning as the shellcheck and shfmt pins in tools/install-dev-tools.sh.
# types-Markdown: mypy --strict over tests/test_site_markdown.py, which drives
# Python-Markdown (from the [docs] extra) the way the site build does.
dev = ["pytest>=8", "pytest-cov", "mypy", "ruff", "clang-format==23.1.3", "codespell", "types-Markdown"]
# The documentation site (tools/build-docs.sh). Separate from `dev` because it
# is the only part of the toolchain the board needs at PROVISIONING time - the
# drive and the web server are built from it - while `dev` is only needed by
# someone changing the code.
#
# Zensical, which replaced MkDocs and Material for MkDocs here once MkDocs 2.0
# was announced to remove the plugin and theming systems this site depends on
# (#52). It is 0.0.x, so any release may change behavior: held below 0.1, with
# the exact version in requirements-lock.txt, and moved deliberately - then
# tools/check.sh, whose diagram gates are what notice an offline site breaking.
docs = ["zensical>=0.0.73,<0.1"]
# What the board's REPL has beyond what `unoq` itself imports: the Qwiic and SPI
# headers. provision/user/35-python-venv.sh installs these by name; they are
# listed here so that python/requirements-lock.txt pins them with the rest.
board = ["smbus2", "spidev"]
# unoq-ble-sensor's D-Bus, to BlueZ (provision/68-ble-sensor.sh). jeepney is
# pure Python with no dependencies of its own, which is why it and not
# dbus-python: that is a C extension, wants a GLib main loop to export objects,
# and the system copy is invisible to a venv built without system packages.
# Installed on the board by provision/user/35-python-venv.sh and for the tests
# by tools/install-dev-tools.sh; only unoq.blesensor imports it.
ble = ["jeepney"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "UP",        # pyupgrade
  "B",         # bugbear
  "SIM",       # simplify
  "C4",        # comprehensions
  "RET",       # return consistency
  "ARG",       # unused arguments
  "PIE",       # misc lints
  "PT",        # pytest style
  "TID",       # tidy imports
  "BLE",       # blind except
  "RUF",       # ruff-specific
]
# __all__ in unoq/__init__.py is grouped by meaning (the module, the class, its
# errors, then the link helpers) rather than alphabetically. That grouping is
# the useful order for a reader, so do not enforce a sort on it.
ignore = ["RUF022"]
# This package drives hardware over a serial line. A blind `except Exception`
# around link-up and reconnect is deliberate and commented at each site: the
# alternative is an unusable API that raises on a board whose link is already
# up. Each one is silenced individually with `noqa`, never blanket-disabled.

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose, and fake hardware classes take
# arguments they intentionally ignore.
"tests/*" = ["ARG001", "ARG002", "ARG005"]
# PT* are pytest-style rules and only make sense in test files. Applied to the
# package they misfire on fota.test() - the MCUboot "mark this image pending"
# call - which is named test() but is not a test.
"unoq/*" = ["PT"]

[tool.ruff.lint.isort]
known-first-party = ["unoq"]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["unoq", "tests"]
strict = true
warn_unreachable = true
pretty = true

# pyserial, gpiod, smpclient and jeepney ship no type information. Silencing the import
# error is scoped to them rather than global, so a typo in a first-party import
# is still an error.
[[tool.mypy.overrides]]
module = ["serial.*", "gpiod.*", "smpclient.*", "jeepney.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-q",
  "--strict-markers",
  "--strict-config",
  # Hardware tests need a live MCU; opt in with `pytest -m hardware`.
  "-m", "not hardware",
  "--cov=unoq",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]
markers = ["hardware: needs a real MCU on /dev/ttyHS1 (deselected by default)"]

[tool.coverage.run]
branch = true
source = ["unoq"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  # `python -m unoq.cpubars` and the like. main() itself is tested; this line only wires it
  # to the interpreter, and covering it would mean re-running the module.
  'if __name__ == "__main__":',
  # Protocol bodies are `...` - type declarations that are never executed. The
  # implementations behind them are covered; the stubs cannot be.
  "class .*\\(Protocol\\):",
]
