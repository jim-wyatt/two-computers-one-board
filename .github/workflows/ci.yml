name: checks

# Runs the same gates as tools/check.sh, so a green CI means the same thing as
# a clean local run. Four jobs:
#
#   changes    seconds. Decides whether the two gated ones below run at all.
#   checks     lint, format, types, tests, coverage, docs, units, workflows.
#   diagrams   opens every page that has a diagram in a pinned headless
#              browser and checks that each one drew. Under a minute.
#   firmware   compiles for the real Cortex-M33 and runs the MCU suites. ~5
#              minutes, because it needs a Zephyr workspace and the SDK.
#
# THE SHAPE HERE IS DELIBERATE. `checks` is the one that runs on everything, so
# it is kept to the gates that are fast and need nothing downloaded but their
# own tools. The other two are each gated on `changes`, and neither holds
# `checks` up - a documentation pull request should not wait on a Zephyr
# download to find out its links are fine.
#
# The cost of getting this wrong is not hypothetical: the browser gate was
# briefly inside `checks`, which took every pull request in the repository from
# thirty seconds to five and a half minutes, including ones that touched no
# documentation at all.
#
# The runner is x86_64 while the board is aarch64. That is fine for `checks`:
# gpiod ships manylinux wheels for both, and the tests use fakes rather than
# real hardware. It is also fine for `firmware`, which cross-compiles - the
# output is Cortex-M33 either way, and native_sim/native/64 is 64-bit on both.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # A named release, not ubuntu-latest. That label moves to Ubuntu 26 on
    # 19 October 2026, and a runner image changing underneath this workflow is
    # what broke the diagram gate twice. Same argument as every other pin here:
    # move it deliberately, in a commit that says so.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        # Exact tag, not @v9: astral-sh publish moving major tags only up
        # to v7, so `@v9` does not resolve and the whole workflow fails to
        # start. Bump this by hand - `latest release` and `latest major tag`
        # are different questions for this action.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dev tooling
        # Same script the board uses; it detects the runner's architecture.
        run: tools/install-dev-tools.sh

      - name: Run gates
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          tools/check.sh python shell c docs workflows

  # Do the diagrams actually draw? The one thing `checks` cannot say: its
  # `diagram assets` gate proves the library is vendored and every page loads
  # the init script, in a quarter of a second and with no browser - but not that
  # mermaid.run() succeeds once called. Only a browser can, so this opens one.
  #
  # THIS JOB WAS REMOVED ONCE (#48) AND IS BACK ON DIFFERENT TERMS (#56). The
  # old gate launched a browser per page with --dump-dom, using whatever
  # chromium the runner image shipped, and failed three times without ever
  # finding a broken diagram:
  #
  #   1. hung, and took an unrelated pull request to the 15-minute job timeout
  #      with chrome still alive
  #   2. reported "0 of 1 drew" on all 11 pages of a build that rendered
  #      perfectly - a shared --user-data-dir serialising the launches
  #   3. chromium 150 never exits from --dump-dom at all;
  #      --virtual-time-budget simply does not end the process
  #
  # All three were about LAUNCHING a browser and waiting for it to EXIT, and
  # two were the runner image's browser changing underneath the job. Neither
  # can happen now:
  #
  #   - one browser is launched and driven over the DevTools protocol, so
  #     nothing waits on a process exiting, and there is one profile and no
  #     per-page launch to collide over it. See tools/check_diagrams.py.
  #   - the browser is a chrome-headless-shell pinned by version AND hash in
  #     tools/install-diagram-browser.sh, not the image's. It moves when a
  #     commit here moves it.
  #   - a browser that stops answering is killed and reported as "the harness
  #     is broken", in seconds, as a different failure from "a diagram did not
  #     draw". The step timeout below is a third line of defence, not the first.
  #
  # Its own job rather than a step in `checks`, so that the day it does break
  # it is one red tick with an obvious name and the fast gates have already
  # answered. Gated on `changes`: firmware-only pull requests cannot affect a
  # diagram. The same NOTE about branch protection as on `firmware` applies.
  diagrams:
    needs: changes
    if: needs.changes.outputs.diagrams == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        # Exact tag for the reason given in `checks`.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install the site's toolchain
        # Only the [docs] extra: this job builds the site and looks at it, and
        # needs none of the linters. The gate's own helper is standard-library
        # python and runs under the runner's python3.
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -q -c python/requirements-lock.txt -b python/requirements-lock.txt -e 'python[docs]'

      - name: Install the pinned browser
        run: |
          browser="$(tools/install-diagram-browser.sh "$RUNNER_TEMP/diagram-browser")"
          echo "UNOQ_DIAGRAM_BROWSER=$browser" >>"$GITHUB_ENV"

      - name: Render every diagram
        # Through check.sh, so this is the command a person would run. It
        # builds the site itself. Seconds when it works; the timeout is for
        # the day it does not, and is far below the job's on purpose.
        timeout-minutes: 5
        run: tools/check.sh diagrams

  # Does this change touch anything the firmware is built from? Anything the
  # site is?
  #
  # Seconds, and it decides whether the five-minute job below runs at all. Most
  # pull requests here are documentation - the course alone is 6,000 lines - and
  # none of them can affect a Cortex-M33 binary. And the reverse for `diagrams`
  # above: a change under mcu/ cannot alter a page.
  #
  # Asking the API for the changed files rather than using a paths-filter action
  # keeps this dependency-free, and rather than `git diff` because a shallow
  # clone does not have the base commit to diff against.
  changes:
    # Listing a pull request's files is a read of the pull request. On this
    # public repository the default token can do that with contents alone, which
    # is why the filter has been working; in a private fork it could not, and it
    # would fall back to "everything" on every pull request without saying why.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      diagrams: ${{ steps.filter.outputs.diagrams }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, not written into the script: none of these
          # is free text today, and that is not a property to depend on.
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
        run: |
          # WHAT CHANGED, ON A PUSH AS WELL AS ON A PULL REQUEST
          #
          # This used to answer "yes, everything" for anything that was not a
          # pull request, so every merge to main re-ran the firmware build and
          # the browser for a change that had touched neither - having just
          # run them, or correctly skipped them, on the pull request that was
          # merged. A push is now asked the same question, against the commit
          # main was at before it.
          #
          # Anything that cannot be answered - a manual run, a first push with
          # no "before", an API that will not say, a change too large for the
          # compare endpoint to list in full - is answered "everything". The
          # filter exists to save minutes, never to skip a check on a guess.
          #
          # main still always has a proven firmware build, which the old rule
          # ("anything that is not a pull request builds, no excuses") was
          # there to guarantee. It holds by construction: the firmware can only
          # change through a push that touches what it is built from, and such
          # a push builds it. A push that touches none of it cannot have
          # changed the binary the last such push proved.
          all() {
            echo "firmware=true" >>"$GITHUB_OUTPUT"
            echo "diagrams=true" >>"$GITHUB_OUTPUT"
            echo "$1 - building, and rendering the diagrams"
            exit 0
          }
          case "$EVENT" in
            pull_request)
              # Both names of a renamed file: one moved out of mcu/ or docs/ is a
              # change to what is built there, and the listing gives its old
              # path only as previous_filename. The count is of raw records,
              # because this endpoint stops at 3000 files without saying so.
              listing=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                --jq '.[] | "F", .filename, (.previous_filename // empty)') ||
                all "could not list the pull request's files"
              [ "$(grep -cx F <<<"$listing")" -lt 3000 ] || all "too large a change to list"
              files=$(grep -vx F <<<"$listing" || true)
              ;;
            push)
              # A forced push is not a step forward from BEFORE, and the compare
              # endpoint answers with merge-base semantics: rewind main past a
              # firmware change and it lists nothing under mcu/, because from
              # the common ancestor's side nothing there was added.
              [ "$FORCED" != true ] || all "a forced push"
              case "$BEFORE" in
                '' | 0000000000000000000000000000000000000000) all "no previous commit to compare with" ;;
              esac
              # The same two precautions. This endpoint stops at 300 files.
              listing=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" \
                --jq '.files[] | "F", .filename, (.previous_filename // empty)') ||
                all "could not compare with the previous commit"
              [ "$(grep -cx F <<<"$listing")" -lt 300 ] || all "too large a change to list"
              files=$(grep -vx F <<<"$listing" || true)
              ;;
            *) all "a manual run" ;;
          esac

          if grep -qE '^(mcu/|west\.yml|west-project-filter|\.github/workflows/ci\.yml)' <<<"$files"; then
            echo "firmware=true" >>"$GITHUB_OUTPUT"
            echo "firmware inputs changed - building"
          else
            echo "firmware=false" >>"$GITHUB_OUTPUT"
            echo "nothing under mcu/ changed - skipping the firmware build"
          fi

          # Everything a page is made from: the pages, the site's configuration
          # and its hooks and gates under tools/, the versions of mkdocs and
          # the theme, and this workflow.
          if grep -qE '^(docs/|mkdocs\.yml|tools/|python/pyproject\.toml|python/requirements-lock\.txt|\.github/workflows/ci\.yml)' <<<"$files"; then
            echo "diagrams=true" >>"$GITHUB_OUTPUT"
            echo "site inputs changed - rendering the diagrams"
          else
            echo "diagrams=false" >>"$GITHUB_OUTPUT"
            echo "nothing the site is built from changed - skipping the browser"
          fi


  # The MCU half. Split into its own job because it needs a Zephyr workspace and
  # the SDK, which the gates above do not - so a formatting mistake still fails
  # in thirty seconds rather than waiting on a toolchain download.
  #
  # This job exists because for a long time it did not: a change that broke the
  # firmware build got a green tick, because nothing outside the board ever
  # compiled it. The version it builds is held equal to the board's by
  # tools/check-zephyr-pin.sh.
  #
  # GATED TWICE, because it is the expensive one (~5 minutes, most of it
  # downloading Zephyr and the SDK):
  #
  #   needs: checks   do not spend five minutes finding out the code does not
  #                   lint. The fast gates take thirty seconds; if they fail,
  #                   this never starts.
  #   if: changes     skip entirely when nothing it builds from was touched.
  #
  # NOTE for branch protection: a skipped job reports as "skipped", not
  # "success". If this is ever made a required check, a documentation-only pull
  # request will sit unmergeable - require `checks` instead, or add a stub job
  # that always succeeds.
  firmware:
    needs: [checks, changes]
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Checked out under a fixed name rather than the repository's, because
          # west.yml has to name this directory and the repository is going to
          # be renamed. See manifest.self.path.
          path: app

      - name: Read the shared module filter
        # Read, not duplicated. The board's provisioning script reads the same
        # file, so CI cannot quietly start building a different module set from
        # the one anybody runs - the same argument as the version pin.
        id: filter
        run: |
          f=app/west-project-filter
          # `|| true`: Actions runs this with `bash -e -o pipefail`, so a file
          # of nothing but comments would make grep exit 1 and kill the step
          # here - before the check below could say why. Let it come back empty
          # and report it properly.
          v="$(grep -vE '^[[:space:]]*(#|$)' "$f" | head -1 || true)"
          [ -n "$v" ] || { echo "no filter line in $f" >&2; exit 1; }
          echo "value=$v" >>"$GITHUB_OUTPUT"
          echo "module filter: $v"

      - name: Set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi
          # Cuts `west update` from 68 projects to roughly 20. The action's own
          # pip/SDK/ccache caches were already hitting; this is the part of the
          # job that was never cacheable, only avoidable.
          west-project-filter: ${{ steps.filter.outputs.value }}

      - name: Build and sign the firmware for the real board
        # mcu/zbuild.sh, the same script the board runs - not a copy of what it
        # does. There used to be a copy here, and the two could drift: change the
        # key path or a flag in one and the other went on reporting green about
        # a build nobody runs.
        #
        # native_sim below exercises the logic; only this proves the code still
        # compiles for a Cortex-M33, links inside the 416K slot, and signs for
        # MCUboot. Signing is the real size check: the build prints Zephyr's own
        # memory table, and imgtool is what fails when the image plus its header
        # and trailer no longer fit - the case that bricks a board on the next
        # update. An unsigned image compiles perfectly and MCUboot then refuses
        # to boot it, which is what the assertion at the end is for.
        working-directory: app
        env:
          # The build part of the version must be a NUMBER: imgtool wants
          # maj.min.rev+build. zbuild.sh defaults to an epoch for the same
          # reason; the run number is the CI equivalent.
          IMAGE_VERSION: 0.0.0+${{ github.run_number }}
        run: |
          # As an environment variable, because that is the form pip also
          # applies inside the isolated environment it builds a package in.
          PIP_CONSTRAINT=mcu/requirements-zephyr-lock.txt pip3 install --quiet imgtool
          # `west topdir`, not $ZEPHYR_BASE: the setup action exports that only
          # within its own steps. Asking west where the workspace is works from
          # any directory inside it.
          ZEPHYR_WORKSPACE="$(west topdir)"
          export ZEPHYR_WORKSPACE
          mcu/zbuild.sh
          hex="$ZEPHYR_WORKSPACE/build/zephyr/zephyr.signed.hex"
          [ -s "$hex" ] || { echo "zbuild.sh produced no $hex" >&2; exit 1; }
          echo "signed image: $(stat -c %s "$hex") bytes"

      - name: Run the MCU test suites
        # mcu/ztest.sh, again the board's own script, so the suites and the
        # platform cannot differ between the two. It picks native_sim/native/64
        # rather than plain native_sim: the latter is a 32-bit target and fails
        # on the board's aarch64 with a CONFIG_64BIT error.
        working-directory: app
        run: |
          ZEPHYR_WORKSPACE="$(west topdir)"
          export ZEPHYR_WORKSPACE
          mcu/ztest.sh
