name: docs site

# Publishes the documentation to GitHub Pages on every push to main - which
# is normally a merge, but a direct push counts too, and should.
#
# It publishes on every push rather than on a tag, deliberately: a site nobody
# can see is not reviewable.
#
# NOT filtered by path. The obvious `paths: [docs/**, mkdocs.yml]` is wrong
# here: the site embeds source files through pymdownx.snippets, so a change to
# mcu/app/src/bars.c changes a rendered page without touching docs/ at all. A
# build is a minute; working out months later why the site is stale is not.
#
# ONE-TIME SETUP: Settings -> Pages -> Source -> "GitHub Actions". Without that
# the deploy step fails with a 404 on the Pages API, which reads like a
# permissions bug and is not.
on:
  push:
    branches: [main]
    # Only when something the site is built from has changed. Without this,
    # every merge rebuilt and redeployed a site that was byte for byte the one
    # already published - a fix to a shell script cost a Pages deployment.
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'tools/build-docs.sh'
      - 'tools/mkdocs_hooks.py'
      - 'python/pyproject.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege: the build job gets none of these, the deploy job gets the
# two the Pages action requires.
permissions:
  contents: read


jobs:
  build:
    # A newer commit makes an unfinished build pointless, so it is cancelled.
    # The deploy below is the opposite: one that has started is left to finish,
    # because half a deployment is worse than a slightly old site, and a newer
    # one simply waits its turn. They used to share one rule, the careful one,
    # which meant a superseded build ran to the end for nothing.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag, not @v9: astral-sh publish moving major tags only up
        # to v7, so `@v9` does not resolve and the whole workflow fails to
        # start. Bump this by hand - `latest release` and `latest major tag`
        # are different questions for this action.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install the docs toolchain
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e 'python[docs]'

      - name: Build (strict)
        # The same script the board runs, so a site that builds here builds
        # there. --strict means a broken internal link fails the job.
        run: tools/build-docs.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: share/learn

  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
