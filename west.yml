#
# A west manifest, used by CI only.
#
# On the board, provision/user/30-zephyr-workspace.sh builds a STANDALONE
# workspace at ~/zephyrproject with `west init -m .../zephyr --mr <version>`,
# and this file is ignored. That layout is deliberate: the Zephyr workspace is 2 GB
# and should survive deleting this checkout.
#
# CI cannot use that shape. zephyrproject-rtos/action-zephyr-setup runs
# `west init -l`, which requires the application repository to BE the manifest
# repository - so the same version has to be declared here as well.
#
# TWO PLACES, ONE VERSION: tools/check-zephyr-pin.sh fails if the revision below
# and ZEPHYR_VERSION in 30-zephyr-workspace.sh disagree, and check.sh runs it on
# every pass. A CI job that compiles a different Zephyr from the board is worse
# than no CI job, because it reports green about something nobody is running.
#
# THE PROJECT FILTER IS NOT HERE, but it is not absent either: west takes it as
# config rather than manifest, so the workflow applies it from the shared
# west-project-filter beside this file, which the board's script reads too.
#
# This used to say CI deliberately cloned everything, on the grounds that a
# runner has the disk and an allowlist is one more thing to keep correct. Two
# things changed that. The allowlist was never hypothetical - the board has
# maintained one all along, so "keep it correct by hand" was already the cost of
# doing business, and sharing it adds no new burden while removing a copy. And
# the disk was never what it cost: `west update` clones 68 projects one at a
# time, 159s of it, almost entirely connection overhead for hardware this board
# does not have.
#
# What actually decided it is the rule three lines below. CI was building 68
# modules against the board's ~20. That is the same class of divergence as the
# version, and it earns the same treatment.
manifest:
  self:
    # The workflow checks this repository out at ./app rather than under its own
    # name, so a repository rename cannot break the build.
    path: app

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.2
      import: true
