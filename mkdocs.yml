#
# The documentation site. One build, three places it has to work:
#
#   1. GitHub Pages          the version a stranger finds first
#   2. http://<board>:8080/  served off the board by unoq-learn
#   3. the "UNO-Q" USB drive opened as file:// on a laptop with no internet
#
# (3) is the constraint that shapes everything below. A site that needs a CDN,
# a font server or a running web server is blank exactly when someone is
# sitting next to the board wondering why it will not enumerate.
#
#   build:  tools/build-docs.sh
#   watch:  .venv/bin/mkdocs serve -f mkdocs.yml -a 0.0.0.0:8000

site_name: Two computers, one board
site_description: >-
  An independent course in hybrid MPU + MCU development, taught on the Arduino
  UNO Q: Linux and a microcontroller sharing a circuit, and how to make them
  cooperate.
site_author: Jim Wyatt
# The second sentence is on every page on purpose. The notice used to live only
# on the Credits page, which is the one page nobody opens, while every page's
# title named somebody else's product.
copyright: >-
  Copyright &copy; 2026 Jim Wyatt &middot; MIT licensed &middot; An independent
  project, not affiliated with or endorsed by Arduino, Qualcomm,
  STMicroelectronics or the Zephyr Project.

# site_url is deliberately NOT set, and this is load-bearing rather than an
# omission. With it, the `privacy` plugin bakes an ABSOLUTE url into the theme
# bundle for the assets it vendors - so the mermaid renderer would be fetched
# from the public site every time a page with a diagram was opened. On the USB
# drive, on a laptop with no network, that is a diagram that never appears.
#
# Without it the same reference comes out relative, and one build works from
# Pages, from the board, and from a folder. Verify after changing anything here:
#
#   grep -o '.\{30\}unpkg.com/mermaid' share/learn/assets/javascripts/bundle.*.js
#
# It must NOT start with https://. The cost is a sitemap without absolute URLs
# and no canonical link tag; the offline case is worth more than the SEO.

repo_url: https://github.com/jim-wyatt/two-computers-one-board
repo_name: jim-wyatt/two-computers-one-board
edit_uri: edit/main/docs/

docs_dir: docs
# Where 75-learning-web.sh serves from and share/build-image.sh copies onto the
# drive. Generated output - it is in .gitignore, not in the repository.
site_dir: share/learn

# Every page is a real .html file, so the same tree works when opened from a
# folder with no server behind it. Directory URLs (`/start-here/`) need a
# server that knows to hand back index.html, which file:// does not.
use_directory_urls: false

# docs/includes/ is raw material for pymdownx.snippets, not pages. Without this
# MkDocs renders abbreviations.md as its own (empty) page and then complains it
# is not in the nav - which --strict turns into a build failure.
exclude_docs: |
  includes/

theme:
  name: material
  language: en
  # No web fonts. Material's default pulls Roboto from Google's servers on
  # every page load; the system stack looks native everywhere and costs nothing.
  font: false
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    # Top-level sections become tabs in the header, so the sidebar only ever
    # shows where you are in the current one. Deliberate: a single flat list of
    # every page in the project reads as a filing cabinet, not a course.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    # Previous/next at the foot of every page. This is what makes the course
    # read as a sequence rather than a pile.
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    # NOT navigation.instant: it fetches pages with XHR, which the browser
    # refuses over file://. The drive matters more than the transition.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light

extra_css:
  - stylesheets/extra.css

# Material vendors mermaid itself (the `privacy` plugin turns its CDN reference
# into a local copy) and emits a script tag for it that resolves correctly from
# every page - but nothing then RENDERS the diagrams. Measured with a headless
# Chromium: the library loads, and `data-processed` stays at 0 on every page.
#
# So the library comes from Material, and the one missing piece - calling
# mermaid.run() over the `pre.mermaid` blocks - is supplied here. extra_javascript
# is emitted as an ordinary <script> tag, per page, with the right number of ../
# for that page's depth. The script itself waits for DOMContentLoaded (and
# retries) rather than acting when it loads, because Material's copy of the
# library has to have defined `mermaid` first.
#
# Verify after changing anything here, because nothing fails when this breaks -
# the diagrams simply come out as text:
#
#   tools/check-diagrams.sh
extra_javascript:
  - assets/javascripts/mermaid-init.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jim-wyatt/two-computers-one-board
      name: The project on GitHub
  # Material's "Made with Material for MkDocs" line stays; it is the licence
  # condition for the free edition and it is fair credit.

plugins:
  - search
  # Downloads anything the theme would otherwise fetch at page load (the
  # search worker shim, most notably) and rewrites the reference to a local
  # copy. This is what makes requirement (3) at the top of this file true.
  # It needs network access at BUILD time, once; the result never does.
  - privacy
  # Must come after search: it turns the search index into a plain script the
  # page can load without XHR, which is the only way search works off a drive.
  - offline

hooks:
  - tools/mkdocs_hooks.py

# Broken links are a build failure, not a log line. `tools/build-docs.sh` runs
# with --strict, and CI runs the same script - the flat one-directory output of
# the previous generator hid nineteen links that were dead on GitHub.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  # Icons and emoji rendered as INLINE SVG, not as a font and not as an image
  # fetched from a CDN. Same reason as `font: false` above.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Lets a page pull a real file out of the repository instead of quoting it:
  #     --8<-- "mcu/app/src/bars.c:draw"
  # A sample that is a copy goes stale silently. A sample that is an include
  # cannot - check_paths turns a moved file into a build failure.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
      # Appended to EVERY page, which is what turns docs/includes/abbreviations.md
      # into site-wide hover definitions for the acronyms. The audience is
      # someone meeting most of these for the first time, and a tooltip is a
      # much smaller interruption than a trip to the glossary.
      auto_append:
        - docs/includes/abbreviations.md
  # Diagrams as ```mermaid fences. Chosen over hand-drawn SVG for one reason:
  # GitHub renders mermaid natively, so the same fence is a picture in the
  # repository AND on the site. The library itself is vendored by the `privacy`
  # plugin above, so no page ever fetches it.
  #
  # The class is `unoq-mermaid`, NOT `mermaid`, and that is the whole point of
  # it. Material's own bundle renders anything classed `mermaid`, and it got
  # there first: it handed the parser the fence including its <code> wrapper,
  # drew mermaid's "Syntax error in text" graphic, and left the temp container
  # (`<div id="d__mermaid_0">`) behind at the end of every page. Two renderers
  # raced on every diagram and the losing one's wreckage stayed in the DOM.
  #
  # Renaming the class takes Material out of it entirely, so assets/javascripts/
  # mermaid-init.js is the only thing that draws these - which is already the
  # arrangement that file exists to create, for the vendored-library path
  # reasons documented in it. GitHub is unaffected: it renders the ```mermaid
  # fence natively and never sees this class.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: unoq-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Deliberately NOT enabled: pymdownx.smartsymbols and pymdownx.tilde. Both
# rewrite characters this project uses literally - (c) in licence headers, and
# `~/two-computers-one-board` in nearly every command.

# Grouped into four acts rather than listed as sixteen. A flat sidebar of
# sixteen chapter titles reads as a filing cabinet; the groups are the argument
# the course is making, and they are the same four the home page uses.
#
# A few entries carry a title of their own. Every page opens with a licence
# comment, so MkDocs does not find the heading under it and names the page
# after its file instead - and a file name has no capitals to give. Seen in the
# sidebar: "Mpu", "Mcu", "Usb", "The linux side", "The led matrix". Only the
# ones a file name gets wrong are spelled out; the rest read correctly as
# they are.
nav:
  - Home: index.md
  - Set up a board: setup.md
  - Course:
      - learn/start-here.md
      - What is actually here:
          - learn/two-computers.md
          - The Linux side: learn/the-linux-side.md
          - learn/the-microcontroller-side.md
          - learn/from-power-to-prompt.md
      - Making them cooperate:
          - learn/how-they-talk.md
          - learn/from-source-to-chip.md
          - learn/how-the-build-knows-your-hardware.md
          - The LED matrix: learn/the-led-matrix.md
      - Living with real hardware:
          - learn/updating-safely.md
          - One cable, many devices: learn/one-cable-many-devices.md
          - learn/four-lights.md
          - learn/debugging-without-a-screen.md
      - Making it yours:
          - learn/knowing-it-works.md
          - learn/from-factory-to-this.md
          - learn/make-it-yours.md
  - Reference:
      # navigation.indexes makes this the Reference tab's own landing page
      # rather than an entry in its list.
      - reference/index.md
      - reference/hardware.md
      - MPU: reference/mpu.md
      - MCU: reference/mcu.md
      - USB: reference/usb.md
      - reference/configuration.md
      - reference/provisioning.md
      - reference/troubleshooting.md
      - reference/clean-board-findings.md
      - reference/development.md
      - Glossary: glossary.md
  - Further reading: further-reading.md
  - Credits: third-party.md
